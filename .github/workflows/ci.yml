name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.22
      # Scoped to rules the codebase actually satisfies, so this job is a real
      # gate instead of a permanent red X. E9 (syntax/IO errors), F63 (broken
      # comparisons), F7 (syntax misuse), F82 (undefined names) are the classes
      # that are always bugs, never taste.
      #
      # Ratchet, in order of cost:
      #   --select E9,F63,F7,F82   passes today
      #   --select E9,F            28 errors  (unused imports/variables)
      #   default ruleset         188 errors
      #   ruff format --check     173 of 237 files reformatted
      # Widen a step at a time, each in its own PR. Do not run `ruff format`
      # while PRs are open — it rewrites ~73% of the tree.
      - name: Ruff check (error-class rules)
        run: ruff check --select E9,F63,F7,F82 bird_mach scripts

  sanity:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Sanity checks
        run: |
          python -m compileall bird_mach scripts
          python -c "from bird_mach.webapp import app; print(app.title)"
          python scripts/bird_sound_3d.py --help > /dev/null

